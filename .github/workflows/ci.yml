name: LegacyLens AI CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Ruff Linter
        run: |
          ruff check backend/ tests/ mcp-server/

      - name: Run Mypy Type Checker
        run: |
          MYPYPATH=. mypy backend/app/schemas/

      - name: Run Automated Pytest Suite
        run: |
          PYTHONPATH=. pytest tests/ -v

      - name: Run Evaluation Benchmark
        run: |
          PYTHONPATH=. python evals/evaluator.py

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run TypeScript Strict Check & Production Build
        working-directory: frontend
        run: npm run build
